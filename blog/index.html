<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Medic Zone - Blog</title>
    <link rel="icon" href="pics/marianne gagnamagnid.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epunda+Slab:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Shared Configuration -->
    <script src="../components/config.js"></script>

    <!-- Unified CSS -->
    <link rel="stylesheet" href="../components/css/unified.css" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RTS1Z5XYJ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RTS1Z5XYJ4');
    </script>

    <style>
      body {
        overflow-x: hidden;
      }

      .blog-content {
        line-height: 1.8;
      }

      .blog-content h1 {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 1.5rem 0;
        color: #ff3f9f;
      }

      .blog-content h2 {
        font-size: 2rem;
        font-weight: bold;
        margin: 1.25rem 0;
        color: #ff96cb;
      }

      .blog-content h3 {
        font-size: 1.5rem;
        font-weight: bold;
        margin: 1rem 0;
        color: #ffb4d6;
      }

      .blog-content p {
        margin: 1rem 0;
      }

      .blog-content ul,
      .blog-content ol {
        margin: 1rem 0;
        padding-left: 2rem;
      }

      .blog-content li {
        margin: 0.5rem 0;
      }

      .blog-content code {
        background: rgba(255, 180, 214, 0.2);
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        font-family: monospace;
      }

      .blog-content pre {
        background: rgba(0, 0, 0, 0.8);
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 1rem 0;
      }

      .blog-content pre code {
        background: none;
        padding: 0;
      }

      .blog-content a {
        color: #ff3f9f;
        text-decoration: underline;
        transition: color 0.2s;
      }

      .blog-content a:hover {
        color: #ff96cb;
      }

      .blog-content blockquote {
        border-left: 4px solid #ff96cb;
        padding-left: 1rem;
        margin: 1rem 0;
        font-style: italic;
        color: #666;
      }

      .blog-content img {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }

      .blog-card {
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(255, 63, 159, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: rgb(27, 0, 12.24);
          color: white;
        }

        .blog-content blockquote {
          color: #ccc;
        }
      }
    </style>
  </head>

  <body
    class="bg-medic-pink font-epunda m-0 p-0 dark:bg-medic-dark-bg dark:text-white"
  >
    <!-- Navigation Placeholder -->
    <div id="nav-placeholder"></div>

    <main class="pt-24 px-6 pb-12 min-h-screen">
      <div id="blogList" class="w-full max-w-[80%] mx-auto">
        <h1
          class="text-5xl md:text-6xl font-bold text-center mb-12 text-medic-hot-pink dark:text-medic-light-pink"
        >
          Blog Posts
        </h1>

        <div id="postsContainer" class="grid grid-cols-1 gap-6">
          <!-- Blog cards will be inserted here -->
        </div>

        <div id="loadingMessage" class="text-center py-12">
          <div
            class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-medic-hot-pink border-t-transparent"
          ></div>
          <p class="mt-4 text-xl">Loading blog posts...</p>
        </div>

        <div id="noPosts" class="hidden text-center py-12">
          <p class="text-2xl text-gray-600 dark:text-gray-400">
            No blog posts yet. Check the console for errors or add your .md
            files to the list!
          </p>
        </div>
      </div>

      <div id="blogPost" class="hidden w-full max-w-[80%] mx-auto">
        <button
          id="backButton"
          class="mb-6 px-6 py-3 bg-medic-hot-pink hover:bg-medic-light-pink text-white rounded-lg transition-colors duration-300 flex items-center gap-2"
        >
          <i class="bi bi-arrow-left"></i> Back to Posts
        </button>

        <article
          class="bg-white dark:bg-medic-dark-nav rounded-2xl shadow-2xl p-8 md:p-12"
        >
          <div id="postContent" class="blog-content">
            <!-- Markdown content will be rendered here -->
          </div>
        </article>
      </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Component Loader -->
    <script src="../components/js/loader.js"></script>

    <script>
      // Configure marked.js
      marked.setOptions({
        breaks: true,
        gfm: true,
      });

      const postsContainer = document.getElementById("postsContainer");
      const loadingMessage = document.getElementById("loadingMessage");
      const noPosts = document.getElementById("noPosts");
      const blogList = document.getElementById("blogList");
      const blogPost = document.getElementById("blogPost");
      const postContent = document.getElementById("postContent");
      const backButton = document.getElementById("backButton");

      // Function to load blog file list from index.json
      async function loadBlogFileList() {
        try {
          const response = await fetch("blog-posts/index.json");
          if (!response.ok) {
            console.error("Failed to load blog index. Using fallback.");
            // Fallback to manual list if index.json doesn't exist yet
            return ["October-2025.md"];
          }
          return await response.json();
        } catch (error) {
          console.error("Error loading blog index:", error);
          // Fallback to manual list
          return ["October-2025.md"];
        }
      }

      // Function to extract metadata from markdown
      function extractMetadata(markdown) {
        const lines = markdown.split("\n");
        let title = "Untitled Post";
        let date = new Date().toISOString().split("T")[0];
        let excerpt = "";

        // Try to find first heading as title
        const titleMatch = markdown.match(/^#\s+(.+)$/m);
        if (titleMatch) {
          title = titleMatch[1];
        }

        // Try to find date in format YYYY-MM-DD
        const dateMatch = markdown.match(/\b(\d{4}-\d{2}-\d{2})\b/);
        if (dateMatch) {
          date = dateMatch[1];
        }

        // Get first paragraph as excerpt
        const paragraphs = markdown
          .split("\n\n")
          .filter((p) => p.trim() && !p.startsWith("#"));
        if (paragraphs.length > 0) {
          excerpt =
            paragraphs[0].substring(0, 150) +
            (paragraphs[0].length > 150 ? "..." : "");
        }

        return { title, date, excerpt };
      }

      // Function to load all blog posts
      async function loadAllPosts() {
        const posts = [];
        const blogFiles = await loadBlogFileList();

        for (const filename of blogFiles) {
          try {
            const response = await fetch(`blog-posts/${filename}`);
            if (!response.ok) {
              console.warn(`Failed to load ${filename}`);
              continue;
            }

            const markdown = await response.text();
            const metadata = extractMetadata(markdown);

            posts.push({
              file: `blog-posts/${filename}`,
              filename: filename,
              title: metadata.title,
              date: metadata.date,
              excerpt: metadata.excerpt,
            });
          } catch (error) {
            console.error(`Error loading ${filename}:`, error);
          }
        }

        // Sort by date (newest first)
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        return posts;
      }

      // Function to create blog card
      function createBlogCard(post, index) {
        const card = document.createElement("div");
        card.className =
          "blog-card bg-white dark:bg-medic-dark-nav rounded-xl p-6 shadow-lg";
        card.innerHTML = `
        <div class="text-sm text-medic-hot-pink dark:text-medic-light-pink mb-2">${post.date}</div>
        <h2 class="text-2xl font-bold mb-3 text-gray-800 dark:text-white">${post.title}</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-4">${post.excerpt}</p>
        <div class="text-medic-hot-pink font-semibold flex items-center gap-2">
          Read More <i class="bi bi-arrow-right"></i>
        </div>
      `;

        card.addEventListener("click", () => loadBlogPost(post));

        // Animate card entrance
        gsap.from(card, {
          opacity: 0,
          y: 50,
          duration: 0.5,
          delay: index * 0.1,
          ease: "back.out(1.7)",
        });

        return card;
      }

      // Function to load blog post
      async function loadBlogPost(post) {
        try {
          const response = await fetch(post.file);
          if (!response.ok) throw new Error("Post not found");

          const markdown = await response.text();
          const html = marked.parse(markdown);

          // Show blog post without fade animation on list
          blogList.classList.add("hidden");
          blogPost.classList.remove("hidden");
          postContent.innerHTML = html;

          gsap.from(blogPost, {
            opacity: 0,
            y: 30,
            duration: 0.5,
            ease: "power2.out",
          });

          window.scrollTo(0, 0);
        } catch (error) {
          console.error("Error loading blog post:", error);
          alert(
            "Failed to load blog post. Make sure the .md file exists in the blog-posts folder."
          );
        }
      }

      // Function to show blog list
      function showBlogList() {
        blogPost.classList.add("hidden");
        blogList.classList.remove("hidden");

        gsap.from(blogList, {
          opacity: 0,
          duration: 0.5,
          ease: "power2.out",
        });

        window.scrollTo(0, 0);
      }

      // Initialize blog
      async function initBlog() {
        const posts = await loadAllPosts();

        loadingMessage.classList.add("hidden");

        if (posts.length === 0) {
          noPosts.classList.remove("hidden");
          return;
        }

        posts.forEach((post, index) => {
          const card = createBlogCard(post, index);
          postsContainer.appendChild(card);
        });
      }

      // Event listeners
      backButton.addEventListener("click", showBlogList);

      // Initialize when everything is ready
      function init() {
        // Verify libraries are loaded
        if (typeof marked === "undefined" || typeof gsap === "undefined") {
          console.error("Required libraries not loaded:", {
            marked: typeof marked !== "undefined",
            gsap: typeof gsap !== "undefined"
          });
          loadingMessage.innerHTML = '<p class="text-red-600 text-xl">Error loading blog libraries. Please refresh the page.</p>';
          return;
        }

        gsap.registerPlugin(ScrollTrigger);
        initBlog();
      }

      // Wait for window.onload to ensure all external scripts are loaded
      // This is more reliable than DOMContentLoaded for CDN scripts
      window.addEventListener("load", init);
    </script>
  </body>
</html>
